# Coolify: Build strategy = Docker Compose → /docker-compose.yaml
# Domain sul servizio vikunja, porta interna 3456
# (es. https://vikunja.example.com:3456)

services:
  vikunja:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    # Named volume Coolify = root. L'immagine gira come 1000 e crasha su
    # "failed to create test file: permission denied" se non forziamo uid 0.
    user: "0:0"
    expose:
      - "3456"
    environment:
      VIKUNJA_SERVICE_INTERFACE: ":3456"
      # SERVICE_URL_VIKUNJA lo genera Coolify dal dominio. Fallback per non
      # crashare al primo deploy (cors.enable richiede publicurl).
      VIKUNJA_SERVICE_PUBLICURL: ${SERVICE_URL_VIKUNJA:-http://localhost:3456}
      VIKUNJA_SERVICE_SECRET: ${SERVICE_PASSWORD_VIKUNJA}
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER:-vikunja}
      VIKUNJA_DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      VIKUNJA_DATABASE_DATABASE: ${POSTGRES_DB:-vikunja}
      VIKUNJA_DATABASE_SSLMODE: disable
    volumes:
      - vikunja_files:/app/vikunja/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vikunja}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-vikunja}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  vikunja_files:
  postgres_data: